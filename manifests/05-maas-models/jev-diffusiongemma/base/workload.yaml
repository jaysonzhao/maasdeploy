apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jev-model-cache
  namespace: jev-maas
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 120Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jev-diffusiongemma
  namespace: jev-maas
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jev-diffusiongemma
  template:
    metadata:
      labels:
        app: jev-diffusiongemma
    spec:
      serviceAccountName: jev-model
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: ip-10-0-17-135.us-east-2.compute.internal
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: verify-image
        image: registry.redhat.io/rhaii-preview/vllm-cuda-rhel9@sha256:24fccf947aa33857611efed0d57aead4efc525c78a882760db5229b702713a1a
        workingDir: /tmp
        command:
        - python
        - -c
        args:
        - "import ast, importlib.metadata as m, importlib.util as u, pathlib\nimport\
          \ transformers, pybase64\nroot = pathlib.Path(u.find_spec('vllm').origin).parent\n\
          src = root / 'model_executor/models/diffusion_gemma.py'\nrequired = ('diffusion_seed_canvas',\
          \ 'diffusion_max_steps',\n            'diffusion_read_only', 'diffusion_pinned',\
          \ 'diffusion_canvas_length')\ntext = src.read_text() if src.is_file() else\
          \ ''\nmissing = [k for k in required if k not in text]\nassert not missing,\
          \ f'Image lacks required engine hooks or inspectable source: {missing}'\n\
          ast.parse(pathlib.Path('/vllm-workspace/examples/features/structured_diffusion/structured_server.py').read_text())\n\
          print('vLLM:', m.version('vllm'), 'transformers:', m.version('transformers'))\n\
          print('Static feature gate passed; require an end-to-end decision test next.')\n"
        resources:
          requests:
            cpu: '1'
            memory: 1Gi
          limits:
            cpu: '2'
            memory: 4Gi
        securityContext: &id001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: structured
          mountPath: /vllm-workspace/examples/features/structured_diffusion
          readOnly: true
      containers:
      - name: vllm
        image: registry.redhat.io/rhaii-preview/vllm-cuda-rhel9@sha256:24fccf947aa33857611efed0d57aead4efc525c78a882760db5229b702713a1a
        workingDir: /tmp
        command:
        - python
        - -m
        - vllm.entrypoints.openai.api_server
        args:
        - --model
        - RedHatAI/diffusiongemma-26B-A4B-it-FP8-dynamic
        - --served-model-name
        - dgemma
        - --host
        - 127.0.0.1
        - --port
        - '8000'
        - --diffusion-config
        - '{"canvas_length":64}'
        - --max-logprobs
        - '32'
        - --enable-prefix-caching
        - --generation-config
        - vllm
        - --dtype
        - bfloat16
        - --max-model-len
        - '8192'
        - --max-num-seqs
        - '4'
        - --tensor-parallel-size
        - '1'
        - --gpu-memory-utilization
        - '0.85'
        - --revision
        - 3b3dae4697494da5a290e9c0461954449e76c4f5
        - --tokenizer-revision
        - 3b3dae4697494da5a290e9c0461954449e76c4f5
        - --enforce-eager
        env: &id003
        - name: HF_HOME
          value: /cache/huggingface
        - name: XDG_CACHE_HOME
          value: /cache/xdg
        - name: VLLM_CACHE_ROOT
          value: /cache/vllm
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: HF_HUB_OFFLINE
          value: '0'
        - name: VLLM_NO_USAGE_STATS
          value: '1'
        resources:
          requests:
            cpu: '4'
            memory: 40Gi
            nvidia.com/gpu: '1'
          limits:
            cpu: '6'
            memory: 56Gi
            nvidia.com/gpu: '1'
        securityContext: *id001
        startupProbe:
          exec: &id002
            command:
            - python
            - -c
            - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).close()
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 180
        readinessProbe:
          exec: *id002
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          exec: *id002
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 10
        volumeMounts:
        - name: cache
          mountPath: /cache
        - name: shm
          mountPath: /dev/shm
      - name: decision
        image: registry.redhat.io/rhaii-preview/vllm-cuda-rhel9@sha256:24fccf947aa33857611efed0d57aead4efc525c78a882760db5229b702713a1a
        workingDir: /tmp
        command:
        - /bin/sh
        - -ec
        args:
        - "python -u -c 'import time,urllib.request\nfor attempt in range(1800):\n\
          \    try:\n        urllib.request.urlopen(\"http://127.0.0.1:8000/health\"\
          ,timeout=3).close()\n        break\n    except Exception:\n        time.sleep(2)\n\
          else:\n    raise SystemExit(\"vLLM did not become healthy\")'\nexec python\
          \ -u /vllm-workspace/examples/features/structured_diffusion/structured_server.py\
          \ \\\n  --upstream http://127.0.0.1:8000 \\\n  --tokenizer /cache/huggingface/hub/models--RedHatAI--diffusiongemma-26B-A4B-it-FP8-dynamic/snapshots/3b3dae4697494da5a290e9c0461954449e76c4f5\
          \ \\\n  --canvas 64 --model dgemma --host 0.0.0.0 --port 8011\n"
        env: *id003
        envFrom:
        - secretRef:
            name: jev-backend-key
        ports:
        - name: decisions
          containerPort: 8011
        resources:
          requests:
            cpu: '1'
            memory: 2Gi
          limits:
            cpu: '2'
            memory: 4Gi
        securityContext: *id001
        startupProbe:
          httpGet:
            path: /health
            port: decisions
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 180
        readinessProbe:
          exec:
            command:
            - python
            - -c
            - import urllib.request; [urllib.request.urlopen('http://127.0.0.1:'+str(p)+'/health',timeout=3).close()
              for p in (8000,8011)]
          periodSeconds: 10
          timeoutSeconds: 8
        livenessProbe:
          httpGet:
            path: /health
            port: decisions
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 10
        volumeMounts:
        - name: cache
          mountPath: /cache
        - name: structured
          mountPath: /vllm-workspace/examples/features/structured_diffusion
          readOnly: true
      volumes:
      - name: cache
        persistentVolumeClaim:
          claimName: jev-model-cache
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
      - name: structured
        configMap:
          name: jev-structured
  progressDeadlineSeconds: 7200
---
apiVersion: v1
kind: Service
metadata:
  name: jev-decision
  namespace: jev-maas
spec:
  selector:
    app: jev-diffusiongemma
  ports:
  - name: decisions
    port: 8011
    targetPort: decisions
