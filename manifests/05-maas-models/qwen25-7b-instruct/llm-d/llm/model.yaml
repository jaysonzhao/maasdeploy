# RedHatAI/Qwen2.5-7B-Instruct on the RHOAI llm-d serving path.
# The router scheduler and InferencePool are reconciled from this LLMInferenceService.
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: redhataiqwen25-7b-instruct
  annotations:
    opendatahub.io/connections: secret-yqrd37
    opendatahub.io/hardware-profile-name: l40s-shared
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
    opendatahub.io/model-type: generative
    openshift.io/display-name: RedHatAI/Qwen2.5-7B-Instruct
  labels:
    opendatahub.io/dashboard: "true"
spec:
  model:
    name: redhataiqwen25-7b-instruct
    uri: oci://registry.redhat.io/rhelai1/modelcar-qwen2-5-7b-instruct:1.5
  replicas: 2
  router:
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
    route: {}
    scheduler: {}
  template:
    containers:
      - name: main
        env:
          - name: VLLM_ADDITIONAL_ARGS
            value: --gpu-memory-utilization=0.45 --max-model-len=32768 --kv-cache-memory-bytes=2684354560
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
            nvidia.com/gpu: "1"
          limits:
            cpu: "2"
            memory: 36Gi
            nvidia.com/gpu: "1"
    nodeSelector:
      nvidia.com/device-plugin.config: NVIDIA-L40S
      nvidia.com/gpu.present: "true"
    # Time slicing does not partition VRAM. Keep llm-d replicas apart and
    # avoid models that already occupy most of the physical L40S memory.
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - gpt-oss-20b
                    - nemotron-safety-guard-vllm
                    - redhataiqwen25-7b-instruct
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - llminferenceservice-workload
                    - model-server
            namespaces: [llm]
            topologyKey: kubernetes.io/hostname
