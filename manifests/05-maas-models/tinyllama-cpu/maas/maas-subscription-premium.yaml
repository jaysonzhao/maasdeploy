apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: tinyllama-1-1b-chat-v1-0-premium
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: TinyLlama CPU Premium Tier
    openshift.io/description: 'Premium tier: 100000 tokens/min for all authenticated
      users'
spec:
  owner:
    groups:
    - name: system:authenticated
    users: []
  modelRefs:
  - name: tinyllama-1-1b-chat-v1-0
    namespace: llm
    tokenRateLimits:
    - limit: 100000
      window: 1m
  priority: 20
