apiVersion: v1
kind: ServiceAccount
metadata:
  name: maas-guided-journey
  namespace: maas-portal
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.maas-guided-journey: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"maas-guided-journey"}}'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: maas-guided-journey-auth-delegator
subjects:
  - kind: ServiceAccount
    name: maas-guided-journey
    namespace: maas-portal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: maas-guided-journey-access
  namespace: maas-portal
rules:
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["maas-guided-journey"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maas-guided-journey-access
  namespace: maas-portal
subjects:
  - kind: Group
    name: system:authenticated
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: maas-guided-journey-access
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-guided-journey
  namespace: maas-portal
  labels:
    app.kubernetes.io/name: maas-guided-journey
    app.kubernetes.io/part-of: maas-guided-journey
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: maas-guided-journey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maas-guided-journey
        app.kubernetes.io/part-of: maas-guided-journey
    spec:
      serviceAccountName: maas-guided-journey
      containers:
        - name: portal
          image: registry.access.redhat.com/ubi9/python-312:latest
          imagePullPolicy: IfNotPresent
          command: ["python3", "/opt/portal/server.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          envFrom:
            - configMapRef:
                name: maas-guided-journey-settings
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: source
              mountPath: /opt/portal
              readOnly: true
        - name: oauth-proxy
          image: registry.redhat.io/openshift4/ose-oauth-proxy@sha256:6bcfa981a7a75c242a16afa6dab36bf6e3b8a1442fa863875919ad551f48eceb
          imagePullPolicy: IfNotPresent
          args:
            - --provider=openshift
            - --https-address=:8443
            - --http-address=
            - --email-domain=*
            - --openshift-service-account=maas-guided-journey
            - --upstream=http://localhost:8080
            - --tls-cert=/etc/tls/private/tls.crt
            - --tls-key=/etc/tls/private/tls.key
            - --cookie-secret-file=/etc/proxy/secrets/session_secret
            - --cookie-secure=true
            - --cookie-name=_maas_guide_session
            - --pass-access-token=false
            - --pass-user-headers=true
            - --skip-auth-regex=^/healthz$
            - --openshift-sar={"namespace":"maas-portal","resource":"services","verb":"get","name":"maas-guided-journey"}
          ports:
            - name: oauth
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /oauth/healthz
              port: oauth
              scheme: HTTPS
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: serving-cert
              mountPath: /etc/tls/private
              readOnly: true
            - name: cookie-secret
              mountPath: /etc/proxy/secrets
              readOnly: true
      volumes:
        - name: source
          configMap:
            name: maas-guided-journey-source
            defaultMode: 0444
        - name: serving-cert
          secret:
            secretName: maas-guided-journey-tls
        - name: cookie-secret
          secret:
            secretName: maas-guided-journey-cookie
---
apiVersion: v1
kind: Service
metadata:
  name: maas-guided-journey
  namespace: maas-portal
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: maas-guided-journey-tls
spec:
  selector:
    app.kubernetes.io/name: maas-guided-journey
  ports:
    - name: https
      port: 443
      targetPort: oauth
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: maas-guided-journey
  namespace: maas-portal
spec:
  to:
    kind: Service
    name: maas-guided-journey
  port:
    targetPort: https
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
