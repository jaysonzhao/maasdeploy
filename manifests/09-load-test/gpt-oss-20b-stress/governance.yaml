apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: gpt-oss-20b-stress-access
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: gpt-oss-20b-stress
    app.kubernetes.io/part-of: maas-load-test
spec:
  modelRefs:
    - name: gpt-oss-20b
      namespace: llm
  subjects:
    users:
      - system:serviceaccount:maas-load-test:gpt-oss-20b-stress
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: gpt-oss-20b-stress
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: gpt-oss-20b-stress
    app.kubernetes.io/part-of: maas-load-test
spec:
  owner:
    users:
      - system:serviceaccount:maas-load-test:gpt-oss-20b-stress
  priority: 90
  modelRefs:
    - name: gpt-oss-20b
      namespace: llm
      tokenRateLimits:
        - limit: 10000000
          window: 1m
